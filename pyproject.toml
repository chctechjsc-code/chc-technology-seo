[project]
name = "chc-technology-seo"
version = "1.0.0"
description = "CHC Technology bilingual SEO skill for Vietnamese and international users"
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"
authors = [{name = "Pham Quoc Cuong"}, {name = "CHC Technology"}]
keywords = ["seo", "claude-code", "schema-markup", "e-e-a-t", "geo", "vietnam"]

[project.urls]
Homepage = "https://chctech.vn"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
